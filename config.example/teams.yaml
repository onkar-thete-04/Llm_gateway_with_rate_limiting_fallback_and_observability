teams:
  - name: acme
    api_key: team_acme_secret_key
    allowed_models:
      - gpt-4o
      - claude-3-5-sonnet
      - llama3.1
    allowed_providers:
      - openai
      - anthropic
      - ollama
    default_provider: openai
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 120000
    budget:
      amount_usd: 100.0
      window: monthly
      warn_at: 0.8
    enrichment:
      system_prompt: "You are a helpful assistant for Acme Corp."
      disclaimer: "Responses are provided for internal use only."
      content_filter:
        rules:
          - pattern: "confidential"
            block: true

  - name: beta
    api_key: team_beta_secret_key
    allowed_models:
      - llama3.1
      - groq-llama3
    allowed_providers:
      - ollama
      - groq
    default_provider: groq
    rate_limit:
      requests_per_minute: 20
      tokens_per_minute: 40000
